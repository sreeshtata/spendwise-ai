services:
  # 1. Backend REST API Web Service
  - type: web
    name: spendwise-api
    env: node
    plan: starter
    region: oregon
    buildCommand: pnpm install && pnpm --filter @spendwise/contracts run build && pnpm --filter @spendwise/api run build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ELASTICSEARCH_NODE
        sync: false

  # 2. Frontend Web Application (Static Site)
  - type: web
    name: spendwise-web
    env: static
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @spendwise/contracts run build && pnpm --filter @spendwise/web run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://spendwise-api.onrender.com/api/v1
      - key: VITE_BASE_PATH
        value: /
